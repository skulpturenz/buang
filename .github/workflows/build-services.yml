name: Build services

on:
  pull_request:
    branches:
        - master
        - staging/*
        - canary/*
        - dev
  workflow_dispatch:

env:
  BRANCH_NAME: ${{ github.base_ref || github.ref_name }}

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 'Short sha'
        id: vars_sha
        run: echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: "Build Docker image: landing-api"
        uses: docker/build-push-action@v5
        env:
          TAG: ${{ case(env.BRANCH_NAME == 'master', 'latest',
            format('{0}-{1}', env.BRANCH_NAME, steps.vars_sha.outputs.short_sha) )}}
        with:
          context: "{{defaultContext}}:api"
          platforms: ${{ matrix.os == 'ubuntu-latest' && 'linux/amd64' || 'linux/arm64' }}
          push: false
          tags: |
            skulpture/buang-api:${{ env.TAG }}
