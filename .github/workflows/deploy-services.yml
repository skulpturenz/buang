name: Deploy services

on:
  push:
    branches:
        - master
        - staging/*
        - canary/*
        - dev
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BRANCH_NAME: ${{ github.base_ref || github.ref_name }}

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]

    if: ${{ always() }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: "Build Docker image: buang-api"
        uses: docker/build-push-action@v5
        env:
          TAG: ${{ case(env.BRANCH_NAME == 'master', 'latest',
            format('{0}-{1}', env.BRANCH_NAME, steps.vars_sha.outputs.short_sha) )}}
        with:
          context: "{{defaultContext}}:api"
          platforms: ${{ matrix.os == 'ubuntu-latest' && 'linux/amd64' || 'linux/arm64' }}
          push: true
          build-args: VERSION='${{ github.sha }}'
          tags: |
            skulpture/buang-api:${{ env.TAG }}-${{ matrix.os == 'ubuntu-latest' && 'amd64' || 'arm64' }}

  docker-push:
    needs: build

    strategy:
      matrix:
        image: [skulpture/buang-api]

    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push ${{ matrix.image }}
        uses: Noelware/docker-manifest-action@v1
        env:
          TAG: ${{ case(env.BRANCH_NAME == 'master', 'latest',
            format('{0}-{1}', env.BRANCH_NAME, steps.vars_sha.outputs.short_sha) )}}
        with:
          inputs: >
            ${{ matrix.image }}:${{ env.TAG }}-amd64,
            ${{ matrix.image }}:${{ env.TAG }}-arm64
          tags: >
            ${{ matrix.image }}:${{ env.TAG }}
          push: true
