# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: '3'

tasks:
  start:
    desc: Run API
    cmds:
      - go run -tags assert .

  dev:
    desc: Run development API
    cmds:
      - go tool gow run -tags assert .

  build:
    desc: Build API
    cmds:
      - go build .

  create-migration:
    desc: Create a new migration
    cmds:
      - go tool migrate create -ext sql -dir db/pg/schema -seq {{.CLI_ARGS}}
      - go tool migrate create -ext sql -dir db/sqlite/schema -seq {{.CLI_ARGS}}

  create-seeder:
    desc: Create a new seeder
    cmds:
      - go tool migrate create -ext sql -dir db/pg/seeder -seq {{.CLI_ARGS}}
      - go tool migrate create -ext sql -dir db/sqlite/seeder -seq {{.CLI_ARGS}}
      - go tool migrate -path db/pg/schema up
      - go tool migrate -path db/pg/seeder up
      - go tool migrate -path db/sqlite/schema up
      - go tool migrate -path db/sqlite/seeder up

  create-query:
    desc: Create a new query
    cmds:
      - touch db/pg/queries/{{.CLI_ARGS}}.sql
      - touch db/sqlite/queries/{{.CLI_ARGS}}.sql

  generate-models:
    desc: Generate DB models
    cmds:
      - go generate ./...

  generate-swagger:
    desc: Generate Swagger documentation
    cmds:
      - go generate ./...

  generate-env-docs:
    desc: Generate docs for env configuration
    cmds:
      - FERRITE_MODE="usage/markdown" go run . > CONFIG.md

  generate-all:
    desc: Run all generators
    deps:
      - generate-models
      - generate-swagger
      - generate-env-docs

  run-temporal-dev:
    desc: Run Temporal dev server
    cmds:
      - docker run --rm -p 7233:7233 -p 8233:8233 temporalio/temporal server start-dev --ip 0.0.0.0

  run-pg:
    desc: Run Postgres for development
    cmds:
      - echo "Connection string = postgresql://postgres:mysecretpassword@localhost/buang?sslmode=disable"
      - echo "User = postgres"
      - echo "Password = mysecretpassword"
      - echo "Database = buang"
      - docker run --rm -e POSTGRES_PASSWORD=mysecretpassword -p 5432:5432 -e POSTGRES_DB=buang postgres

  deploy-prod:
    desc: Deploy compose service in production
    cmds:
      - mkdir -p /deployments
      - echo "Buang depends on Temporal, you can use Temporal Cloud or self host it by following the docs at https://docs.temporal.io/self-hosted-guide"
      - docker-compose -f docker-compose.prod.yml up

  test-int-ci:
    desc: Run tests
    cmds:
      - GO_ENV="test" BUANG_TRAEFIK_DYNAMIC_CONFIG_DIR="/tmp/buang_test" TESTCONTAINERS_REUSE_ENABLE=false BUANG_TEST_GITHUB_USER=$BUANG_TEST_GITHUB_USER BUANG_TEST_GITHUB_PAT=$BUANG_TEST_GITHUB_PAT go test -count=1 {{.CLI_ARGS}} ./tests/integration_tests

  test-fitness-ci:
    desc: Run tests
    cmds:
      - GO_ENV="test" BUANG_TRAEFIK_DYNAMIC_CONFIG_DIR="/tmp/buang_test" TESTCONTAINERS_REUSE_ENABLE=false BUANG_TEST_GITHUB_USER=$BUANG_TEST_GITHUB_USER BUANG_TEST_GITHUB_PAT=$BUANG_TEST_GITHUB_PAT go test -count=1 {{.CLI_ARGS}} ./tests/fitness_tests

  test-int:
    desc: Run tests
    cmds:
      - GO_ENV="test" TESTCONTAINERS_REUSE_ENABLE=false BUANG_TEST_GITHUB_USER=$BUANG_TEST_GITHUB_USER BUANG_TEST_GITHUB_PAT=$BUANG_TEST_GITHUB_PAT go test -count=1 {{.CLI_ARGS}} ./tests/integration_tests

  test-int-watch:
    desc: Run tests in watch mode
    cmds:
      - GO_ENV="test" TESTCONTAINERS_REUSE_ENABLE=false BUANG_TEST_GITHUB_USER=$BUANG_TEST_GITHUB_USER BUANG_TEST_GITHUB_PAT=$BUANG_TEST_GITHUB_PAT go tool gow test -count=1 {{.CLI_ARGS}} ./tests/integration_tests

  test-fitness:
    desc: Run tests
    cmds:
      - GO_ENV="test" TESTCONTAINERS_REUSE_ENABLE=false BUANG_TEST_GITHUB_USER=$BUANG_TEST_GITHUB_USER BUANG_TEST_GITHUB_PAT=$BUANG_TEST_GITHUB_PAT go test -count=1 {{.CLI_ARGS}} ./tests/fitness_tests

  test-fitness-watch:
    desc: Run fitness tests in watch mode
    cmds:
      - GO_ENV="test" TESTCONTAINERS_REUSE_ENABLE=false BUANG_TEST_GITHUB_USER=$BUANG_TEST_GITHUB_USER BUANG_TEST_GITHUB_PAT=$BUANG_TEST_GITHUB_PAT go tool gow test -count=1 {{.CLI_ARGS}} ./tests/fitness_tests
