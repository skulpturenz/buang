networks:
  buang:
    driver: bridge

services:
  proxy:
    image: traefik
    restart: unless-stopped
    command: >
      --providers.file.directory=/app/deployments
      --providers.file.watch=true
      --providers.docker=true
      --providers.docker.exposedByDefault=false
      --entryPoints.web.address=:80
      --entryPoints.websecure.address=:443
      --entryPoints.websecure.asDefault=true
      --entryPoints.web.http.redirections.entryPoint.to=websecure
      --entryPoints.web.http.redirections.entryPoint.scheme=https
      --ping=true
      --entrypoints.metrics.address=:8082
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /buang/traefik:/app/deployments
    ulimits:
      nofile:
        soft: 20000
        hard: 20000
    networks:
      - buang
    healthcheck:
      test: [ "CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8082/ping || exit 1" ]
      interval: 1m30s
      timeout: 1m
      retries: 5
      start_period: 30s
    deploy:
      mode: replicated
      replicas: 2

  buang:
    image: skulpture/buang
    restart: unless-stopped
    environment:
      GO_ENV: "production"
      API_KEY: ${BUANG_API_KEY}
      ENABLE_TELEMETRY: ${BUANG_ENABLE_TELEMETRY}
      OTEL_SERVICE_NAME: ${BUANG_OTEL_SERVICE_NAME}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${BUANG_OTEL_EXPORTER_OTLP_ENDPOINT}
      DB_TYPE: ${BUANG_DB_TYPE}
      DB_CONNECTION_STRING: ${BUANG_DB_CONNECTION_STRING}
      # set temporal client env variables as required
      # docs: https://docs.temporal.io/references/client-environment-configuration
      TEMPORAL_API_KEY: ${BUANG_TEMPORAL_API_KEY}
      TEMPORAL_NAMESPACE: ${BUANG_TEMPORAL_NAMESPACE}
      TEMPORAL_ADDRESS: ${BUANG_TEMPORAL_ADDRESS}
    volumes:
      - /buang/traefik:/app/deployments
    ulimits:
      nofile:
        soft: 20000
        hard: 20000
    networks:
      - buang
    healthcheck:
      test: [ "CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost/ping || exit 1" ]
      interval: 1m30s
      timeout: 1m
      retries: 5
      start_period: 30s
    deploy:
      mode: replicated
      replicas: 2
