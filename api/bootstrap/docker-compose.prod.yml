networks:
  buang:
    driver: bridge

services:
  proxy:
    image: traefik
    restart: unless-stopped
    command: >
      --providers.file.directory=/app/deployments
      --providers.file.watch=true
      --providers.docker=true
      --providers.docker.exposedByDefault=false
      --entryPoints.web.address=:${BUANG_TRAEFIK_ENTRYPOINT_WEB_PORT:-80}
      --entryPoints.websecure.address=:${BUANG_TRAEFIK_ENTRYPOINT_WEBSECURE_PORT:-443}
      --entryPoints.websecure.asDefault=true
      --entryPoints.web.http.redirections.entryPoint.to=websecure
      --entryPoints.web.http.redirections.entryPoint.scheme=https
      --ping=true
      --entrypoints.metrics.address=:8082
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${BUANG_TRAEFIK_DYNAMIC_CONFIG_DIR:-/buang/traefik}:/app/deployments
    ulimits:
      nofile:
        soft: 20000
        hard: 20000
    networks:
      - buang
    healthcheck:
      test: [ "CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8082/ping || exit 1" ]
      interval: 1m30s
      timeout: 1m
      retries: 5
      start_period: 30s
    deploy:
      mode: replicated
      replicas: 2

  buang:
    image: skulpture/buang
    restart: unless-stopped
    environment:
      GO_ENV: "production"
      BUANG_LOG_LEVEL: ${BUANG_LOG_LEVEL}
      BUANG_API_KEY: ${BUANG_API_KEY}
      BUANG_ENABLE_TELEMETRY: ${BUANG_ENABLE_TELEMETRY}
      BUANG_OTEL_SERVICE_NAME: ${BUANG_OTEL_SERVICE_NAME}
      BUANG_OTEL_EXPORTER_OTLP_ENDPOINT: ${BUANG_OTEL_EXPORTER_OTLP_ENDPOINT}
      BUANG_DB_TYPE: ${BUANG_DB_TYPE}
      BUANG_DB_CONNECTION_STRING: ${BUANG_DB_CONNECTION_STRING}
      # set temporal client env variables as required
      # docs: https://docs.temporal.io/references/client-environment-configuration
      BUANG_TEMPORAL_API_KEY: ${BUANG_TEMPORAL_API_KEY}
      BUANG_TEMPORAL_NAMESPACE: ${BUANG_TEMPORAL_NAMESPACE}
      BUANG_TEMPORAL_ADDRESS: ${BUANG_TEMPORAL_ADDRESS}
      BUANG_DURABLE_EXECUTOR: ${BUANG_DURABLE_EXECUTOR}
      BUANG_DBOS_CONDUCTOR_API_KEY: ${BUANG_DBOS_CONDUCTOR_API_KEY}
      BUANG_DBOS_CONDUCTOR_URL: ${BUANG_DBOS_CONDUCTOR_URL}
      BUANG_DBOS_ADMIN_SERVER_PORT: ${BUANG_DBOS_ADMIN_SERVER_PORT}
      BUANG_ENABLE_EXPERIMENTAL_BOOTSTRAP: ${BUANG_ENABLE_EXPERIMENTAL_BOOTSTRAP}
      BUANG_HOUSEKEEPING_PRUNE_DEPLOYMENTS: ${BUANG_HOUSEKEEPING_PRUNE_DEPLOYMENTS}
      BUANG_EXPERIMENTAL_HOUSEKEEPING_AUTO_UPDATE: ${BUANG_EXPERIMENTAL_HOUSEKEEPING_AUTO_UPDATE}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${BUANG_TRAEFIK_DYNAMIC_CONFIG_DIR:-/buang/traefik}:/app/deployments
    ulimits:
      nofile:
        soft: 20000
        hard: 20000
    networks:
      - buang
    healthcheck:
      test: [ "CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost/ping || exit 1" ]
      interval: 1m30s
      timeout: 1m
      retries: 5
      start_period: 30s
    deploy:
      mode: replicated
      replicas: 2
